<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pulse</title>
    <style>
      html, body { margin: 0; background: #000; color: #fff; font-family: -apple-system, system-ui, sans-serif; }
      .wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
      .bolt { font-size: 56px; color: #F5B62E; }
      .brand { font-weight: 800; letter-spacing: 0.08em; }
      .mute { font-size: 12px; color: #6B7280; }
    </style>
  </head>
  <body>
    <!--
      This file is only used as the Capacitor webDir. The real app lives
      at https://pulse-engine.xyz and Capacitor's server.url config points
      the WKWebView directly there, so this page is almost never seen.
      It's shown for ~a frame on cold start, then the remote site takes
      over. Keep it visually consistent so there's no theme flash.
    -->
    <div class="wrap">
      <div class="bolt">⚡</div>
      <div class="brand">NOVARYS <span style="color:#F5B62E">//</span> PULSE</div>
      <div class="mute">loading…</div>
    </div>
  </body>
</html>
